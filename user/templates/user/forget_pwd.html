<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱发送重置密码</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* 设置背景图 */
            background-image: url('/media/images/forget.jpeg'); /* 替换为你的图片路径 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .forget-container {
            background-color: rgba(255, 255, 255, 0.5); /* 半透明白色背景 */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .forget-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .forget-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .forget-container button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .forget-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="forget-container">
    <h2>用户注册</h2>
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">发送</button>
    </form>
        <!-- 对错误信息进行标红显示-->
        <style>
            .errorlist {
                color: red;
            }
        </style>

</div>
</body>
</html>
